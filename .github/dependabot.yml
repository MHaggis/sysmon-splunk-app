version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /.ci
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      appinspect-dependencies:
        patterns: ['*']
