# Override this selector in local/macros.conf to add your index restriction.
# Generic XmlWinEventLog contains other Windows logs; select it by Sysmon source.
[sysmon]
definition = (source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" OR source="WinEventLog:Microsoft-Windows-Sysmon/Operational" OR sourcetype="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" OR sourcetype="WinEventLog:Microsoft-Windows-Sysmon/Operational" OR sourcetype="WinEventLog:Sysmon")
iseval = 0
