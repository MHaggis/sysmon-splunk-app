# App-owned search-time fields. Raw/CIM fields are left intact.
# Each expression is independent: Splunk evaluates EVAL fields in parallel.
# Source stanzas support the current TA even when sourcetype is XmlWinEventLog.
# Sysmon-specific sourcetype stanzas retain older/custom deployments.

[source::XmlWinEventLog:Microsoft-Windows-Sysmon/Operational]
EVAL-sysmon_computer = coalesce(Computer, ComputerName)
EVAL-sysmon_process_path = Image
EVAL-sysmon_process_name = replace(Image, "^.*[\\\\/]", "")
EVAL-sysmon_parent_process_name = replace(ParentImage, "^.*[\\\\/]", "")
EVAL-sysmon_user = coalesce(User, user)
EVAL-sysmon_src_host = coalesce(nullif(nullif(SourceHostname, "-"), ""), SourceIp, SourceIP, src_host, src_ip)
EVAL-sysmon_dest_host = coalesce(nullif(nullif(DestinationHostname, "-"), ""), DestinationIp, DestinationIP, dest_host, dest_ip)
EVAL-sysmon_dest_ip = coalesce(DestinationIp, DestinationIP, dest_ip)
EVAL-sysmon_dest_port = coalesce(DestinationPort, dest_port)
EVAL-sysmon_protocol = coalesce(Protocol, protocol)


